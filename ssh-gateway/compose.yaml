services:
  ssh-gateway:
    build: .
    profiles: ["tools"]
    env_file: .env.gateway
    volumes:
      - gateway_audit:/data
      # HLA_SECRET_STORE_V1: the local secret store (secrets.enc), and the inventory (read-only).
      - gateway_secrets:/data/secrets
      - ../config/inventory.yaml:/config/inventory.yaml:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
    environment:
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    # No published ports; invoked manually via docker compose run.
volumes:
  gateway_audit:
  gateway_secrets:
